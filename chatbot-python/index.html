<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shena - Asistente CENIGRAF</title>
  <style>
    /* Paleta tomada de tu imagen de referencia */
    :root {
      --fondo-arriba: #e6e3f7;
      --fondo-abajo: #d9e6f0;
      --primario: #7b6fd0;
      --primario-oscuro: #5b4fc9;
      --burbuja-bot: #f1f0fb;
      --burbuja-usuario: #9d93e3;
      --texto-bot: #4a4399;
      --texto-usuario: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font: 16px system-ui, sans-serif;
      background: linear-gradient(180deg, var(--fondo-arriba), var(--fondo-abajo));
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
    }

    header h1 {
      margin: 0;
      color: var(--primario-oscuro);
      font-size: 1.6rem;
      letter-spacing: .05em;
    }
    header p { margin: .2rem 0 1rem; color: var(--primario); }

    #chat {
      flex: 1;
      min-height: 320px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 1rem;
      background: rgba(255, 255, 255, .45);
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .mensaje {
      max-width: 80%;
      padding: .7rem 1rem;
      margin: .6rem 0;
      border-radius: 18px;
      white-space: pre-wrap;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .mensaje.bot {
      background: var(--burbuja-bot);
      color: var(--texto-bot);
      border-bottom-left-radius: 4px;
    }
    .mensaje.usuario {
      background: var(--burbuja-usuario);
      color: var(--texto-usuario);
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    form { display: flex; gap: .5rem; }
    input {
      flex: 1;
      padding: .85rem 1rem;
      border: 2px solid transparent;
      border-radius: 999px;
      background: #fff;
      font-size: 1rem;
      color: var(--texto-bot);
    }
    input:focus { outline: none; border-color: var(--primario); }
    button {
      padding: .85rem 1.3rem;
      border: 0;
      border-radius: 999px;
      background: var(--primario);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--primario-oscuro); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>SHENA</h1>
      <p>Asistente de información - CENIGRAF</p>
    </header>

    <div id="chat" aria-live="polite">
      <div class="mensaje bot">¡Hola! Soy Shena. Escribe un mensaje para empezar.</div>
    </div>

    <form id="form">
      <input id="message" autocomplete="off" placeholder="Escribe tu mensaje…" required maxlength="2000">
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script>
    const chat = document.querySelector('#chat');
    const form = document.querySelector('#form');
    const input = document.querySelector('#message');

    // Crea una burbuja; "quien" es 'bot' o 'usuario' y decide el color
    function agregarMensaje(quien, texto) {
      const div = document.createElement('div');
      div.className = 'mensaje ' + quien;
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      agregarMensaje('usuario', message);
      input.value = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error('No se pudo obtener una respuesta.');

        const data = await response.json();
        agregarMensaje('bot', data.reply);
      } catch (error) {
        agregarMensaje('bot', 'Error: ' + error.message);
      }
    });
  </script>
</body>
</html>
