<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Senita - Asistente CENIGRAF</title>
  <style>
    :root {
      --fondo-arriba: #e6e3f7;
      --fondo-abajo: #d9e6f0;
      --primario: #7b6fd0;
      --primario-oscuro: #5b4fc9;
      --burbuja-bot: #f1f0fb;
      --burbuja-usuario: #9d93e3;
      --texto-bot: #4a4399;
      --texto-usuario: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font: 16px system-ui, sans-serif;
      background: linear-gradient(180deg, var(--fondo-arriba), var(--fondo-abajo));
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
    }

    header h1 {
      margin: 0;
      color: var(--primario-oscuro);
      font-size: 1.6rem;
      letter-spacing: .05em;
    }
    header p { margin: .2rem 0 1rem; color: var(--primario); }

    .faq {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .faq-btn {
      padding: .5rem .9rem;
      font-size: .9rem;
      background: var(--burbuja-bot);
      color: var(--texto-bot);
      border: 1px solid var(--primario);
    }
    .faq-btn:hover {
      background: var(--primario);
      color: #fff;
    }

    #chat {
      flex: 1;
      min-height: 320px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 1rem;
      background: rgba(255, 255, 255, .45);
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .mensaje {
      max-width: 80%;
      padding: .7rem 1rem;
      margin: .6rem 0;
      border-radius: 18px;
      white-space: pre-wrap;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .mensaje.bot {
      background: var(--burbuja-bot);
      color: var(--texto-bot);
      border-bottom-left-radius: 4px;
    }
    .mensaje.usuario {
      background: var(--burbuja-usuario);
      color: var(--texto-usuario);
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    /* Indicador "escribiendo" */
    .escribiendo {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-style: italic;
    }
    .puntos { display: inline-flex; gap: 4px; }
    .puntos span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primario);
      animation: salto 1.2s infinite ease-in-out;
    }
    .puntos span:nth-child(2) { animation-delay: .2s; }
    .puntos span:nth-child(3) { animation-delay: .4s; }

    @keyframes salto {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    form { display: flex; gap: .5rem; }
    input {
      flex: 1;
      padding: .85rem 1rem;
      border: 2px solid transparent;
      border-radius: 999px;
      background: #fff;
      font-size: 1rem;
      color: var(--texto-bot);
    }
    input:focus { outline: none; border-color: var(--primario); }
    button {
      padding: .85rem 1.3rem;
      border: 0;
      border-radius: 999px;
      background: var(--primario);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--primario-oscuro); }
    button:disabled { opacity: .6; cursor: not-allowed; }


    /*boton limpiar chat */
    .barra { display: flex; justify-content: flex-end; margin-bottom: .5rem; }
    .btn.limpiar {
      padding: 5rem 1rem;
      font-size: .9rem;
      background: #4a4399
    }
    .btn-limpiar:hover { background: #9d93e3;}

  </style>

</head>
<body>
  <div class="app">
    <header>
      <h1>Senita</h1>
      <p>Asistente de información - CENIGRAF</p>
    </header>

    <div class="faq">
      <button type="button" class="faq-btn" data-pregunta="¿Qué programas ofrece CENIGRAF?">¿Qué programas ofrece CENIGRAF?</button>
      <button type="button" class="faq-btn" data-pregunta="¿Cuáles son los requisitos de inscripción?">¿Cuáles son los requisitos de inscripción?</button>
      <button type="button" class="faq-btn" data-pregunta="¿Cómo es el proceso de matrícula?">¿Cómo es el proceso de matrícula?</button>
      <button type="button" class="faq-btn" data-pregunta="¿Dónde se encuentra CENIGRAF?">¿Dónde se encuentra CENIGRAF?</button>
      <button type="button" class="faq-btn" data-pregunta="¿Cuáles son los horarios?">¿Cuáles son los horarios?</button>
    </div>

    <div class="barra">
    <button type="button" id="btn-limpiar" class="btn-limpiar">🗑 Limpiar chat</button>
    </div>
    
    <div id="chat" aria-live="polite">
      <div class="mensaje bot">¡Hola! Soy Senita 🦜 . Escribe un mensaje o elige una pregunta frecuente.</div>
    </div>

    <form id="form">
      <input id="message" autocomplete="off" placeholder="Escribe tu mensaje…" required maxlength="2000">
      <button type="submit">Enviar 💮</button>
    </form>
  </div>

  
  <script>
    const chat = document.querySelector('#chat');
    const form = document.querySelector('#form');
    const input = document.querySelector('#message');
    const btnLimpiar = document.querySelector('#btn-limpiar');
    const MENSAJE_INICIAL = '¡Hola! Soy Shena. Escribe un mensaje o elige una pregunta frecuente.';

    function agregarMensaje(quien, texto) {
      const div = document.createElement('div');
      div.className = 'mensaje ' + quien;
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function mostrarEscribiendo() {
      const div = document.createElement('div');
      div.id = 'escribiendo';
      div.className = 'mensaje bot escribiendo';
      div.innerHTML =
        '<span class="puntos"><span></span><span></span><span></span></span>' +
        '<span>El chatbot está escribiendo…</span>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function ocultarEscribiendo() {
      const div = document.querySelector('#escribiendo');
      if (div) div.remove();
    }

    function bloquear(estado) {
      input.disabled = estado;
      btnLimpiar.disabled = estado;
      document.querySelector('#form button').disabled = estado;
      document.querySelectorAll('.faq-btn').forEach((b) => (b.disabled = estado));
    }

    // Borra la conversación visible, pidiendo confirmación antes
    function limpiarChat() {
      const confirmado = confirm('¿Seguro que quieres borrar toda la conversación?');
      if (!confirmado) return;

      chat.innerHTML = '';
      agregarMensaje('bot', MENSAJE_INICIAL);
      input.focus();
    }

    async function enviarMensaje(texto) {
      agregarMensaje('usuario', texto);
      bloquear(true);
      mostrarEscribiendo();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: texto })
        });
        if (!response.ok) throw new Error('No se pudo obtener una respuesta.');

        const data = await response.json();
        ocultarEscribiendo();
        agregarMensaje('bot', data.reply);
      } catch (error) {
        ocultarEscribiendo();
        agregarMensaje('bot', 'Error: ' + error.message);
      } finally {
        ocultarEscribiendo();
        bloquear(false);
        input.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      enviarMensaje(message);
    });

    document.querySelectorAll('.faq-btn').forEach((boton) => {
      boton.addEventListener('click', () => {
        enviarMensaje(boton.dataset.pregunta);
      });
    });

    btnLimpiar.addEventListener('click', limpiarChat);
  </script>
</body>
</html>
